<body>

    <!-- FONDO GLOBAL: video fijo. Nítido en Inicio, difuminado en los demás apartados -->
    <div class="fondo-global" aria-hidden="true">

            </li>

            <li class="nav-item">
                <button class="nav-link" type="button" aria-haspopup="true" aria-expanded="false">
                    Contenido
                    <svg class="nav-arrow" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <ul class="dropdown-menu">
                    <li><a href="#inicio">Temario</a></li>

                </ul>
            </li>

            <li class="nav-item">
                <button class="nav-link" type="button" aria-haspopup="true" aria-expanded="false">
                    Requisitos
                    <svg class="nav-arrow" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

                </button>
                <ul class="dropdown-menu">
                    <li><a href="#inicio">HTML</a></li>
                    <li><a href="#inicio">CSS</a></li>

                <button class="nav-link" type="button" aria-haspopup="true" aria-expanded="false">

                </button>

                    <li><a href="#inicio">Galería</a></li>

    <main>

        <section id="inicio"></section>

        <section id="contenido" class="gallery oculta">
            <h2>Galería</h2>
            <div class="gallery-grid">
                <figure class="gallery-item">
                    <img src="Images/yeison.png" alt="Ilustración de Yeison" loading="lazy">
                </figure>
                <figure class="gallery-item">
                    <img src="Images/FB_IMG_1771161963658.jpg" alt="Foto guardada desde Facebook" loading="lazy">
                </figure>
                <figure class="gallery-item">
                    <img src="Images/illust_100641790_20260103_205830.png" alt="Ilustración estilo anime" loading="lazy">
                </figure>
                <figure class="gallery-item">
                    <img src="Images/chica-maid-rosa.jpg" alt="Chica de pelo rosa con traje de maid" loading="lazy">
                </figure>
                <figure class="gallery-item">
                    <img src="Images/chibi-pulgar.webp" alt="Chibi de pelo rosa con el pulgar arriba" loading="lazy">
                </figure>
                <figure class="gallery-item">
                    <picture>
                        <source media="(max-width: 768px)" srcset="Images/miniaturas/chica-lentes-corona.jpg">
                        <img src="Images/chica-lentes-corona.jpg" alt="Chica de pelo plateado con lentes y corona" loading="lazy">
                    </picture>
                </figure>
            </div>
        </section>

    </main>

    <!-- LIGHTBOX: visor de imagen ampliada -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">&times;</button>
            <img id="lightboxImg" src="" alt="">
            <button id="lightboxDownload" class="lightbox-download" type="button">Descargar imagen</button>
        </div>
    </div>

    <script>
        // ===== MENU DESPLEGABLE =====
        const navItems = document.querySelectorAll('.nav-item');

        function cerrarMenus(){
            navItems.forEach(item => {
                item.classList.remove('open');
                item.querySelector('.nav-link').setAttribute('aria-expanded', 'false');
            });
        }

        navItems.forEach(item => {
            const btn = item.querySelector('.nav-link');
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const yaAbierto = item.classList.contains('open');
                cerrarMenus();
                if (!yaAbierto){
                    item.classList.add('open');
                    btn.setAttribute('aria-expanded', 'true');
                }
            });
        });

        // Cierra el menú si se hace clic en cualquier otra parte de la página,
        // o al elegir una opción dentro del desplegable
        document.addEventListener('click', cerrarMenus);

        // ===== APARTADOS TIPO PESTAÑA =====
        // Solo se ve un apartado a la vez, justo debajo del menú, y la página
        // vuelve arriba del todo. La galería solo se muestra desde
        // Contenido > Recursos; cualquier otra opción la vuelve a ocultar.
        const seccionContenido = document.getElementById('contenido');

        function mostrarApartado(esRecursos, esInicio){
            // Video nítido solo en Inicio; difuminado en cualquier otro apartado
            document.body.classList.toggle('difuminado', !esInicio);

            // En celular el video se pausa mientras está difuminado: casi no se
            // nota el movimiento y así no se recalcula el desenfoque en cada cuadro
            if (esCelular.matches && !reducirMovimiento){
                if (esInicio) videoFondo.play().catch(() => {});
                else videoFondo.pause();
            }

            if (esRecursos){
                seccionContenido.classList.remove('oculta', 'visible');
                void seccionContenido.offsetWidth; // reinicia la animación de entrada
                seccionContenido.classList.add('visible');
            } else {
                seccionContenido.classList.add('oculta');
                seccionContenido.classList.remove('visible');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.querySelectorAll('.dropdown-menu a').forEach(enlace => {
            enlace.addEventListener('click', (e) => {
                e.preventDefault();
                const esInicio = enlace.closest('.nav-item').dataset.grupo === 'inicio';
                mostrarApartado(enlace.id === 'linkRecursos', esInicio);
                setTimeout(cerrarMenus, 150);
            });
        });

        // El título "Frozen Project" lleva de vuelta a Inicio
        document.getElementById('linkTitulo').addEventListener('click', (e) => {
            e.preventDefault();
            mostrarApartado(false, true);
            cerrarMenus();
        });

        // ===== VIDEO DE FONDO =====
        // El video empieza justo debajo del menú para que el halo no quede tapado
        const cabecera = document.querySelector('header');
        const menu = document.querySelector('nav');
        function ajustarAltoCabecera(){
            const alto = cabecera.offsetHeight + menu.offsetHeight;
            document.documentElement.style.setProperty('--alto-cabecera', alto + 'px');

            // Si un desplegable no cabe a la derecha (p. ej. en celular), se abre hacia la izquierda
            navItems.forEach(item => {
                const panel = item.querySelector('.dropdown-menu');
                const izquierda = item.getBoundingClientRect().left;
                item.classList.toggle('abre-izquierda', izquierda + panel.offsetWidth > window.innerWidth - 8);
            });
        }
        ajustarAltoCabecera();
        window.addEventListener('resize', ajustarAltoCabecera);
        window.addEventListener('load', ajustarAltoCabecera);

        const videoFondo = document.getElementById('fondoVideo');
        const esCelular = window.matchMedia('(max-width: 768px)');
        const reducirMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Respeta a quien prefiere menos movimiento: deja el video quieto
        if (reducirMovimiento) videoFondo.pause();

        if (esCelular.matches){
            // Navegadores antiguos que ignoran media="" en <source>: forzar la versión de celular
            const asegurarVideoMovil = () => {
                if (!videoFondo.currentSrc.includes('fondo-movil')){
                    videoFondo.src = 'Video/fondo-movil.mp4';
                    if (!reducirMovimiento) videoFondo.play().catch(() => {});
                }
            };
            if (videoFondo.readyState > 0) asegurarVideoMovil();
            else videoFondo.addEventListener('loadedmetadata', asegurarVideoMovil, { once: true });
            // Pausa el video si la pestaña queda en segundo plano (ahorra batería)
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) videoFondo.pause();
                else if (!document.body.classList.contains('difuminado') && !reducirMovimiento) videoFondo.play().catch(() => {});
            });
        }

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxDownload = document.getElementById('lightboxDownload');
        const lightboxClose = document.getElementById('lightboxClose');

        let currentImgUrl = '';
        let currentImgName = '';

        function openLightbox(img){
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt;
            currentImgUrl = img.src;
            currentImgName = img.src.split('/').pop();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function guardarBlob(blob, nombre){
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nombre;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // Descarga la imagen sin salir de la página.
        // 1) Baja el archivo original tal cual (mismo formato y calidad).
        // 2) Si eso falla (p. ej. abriendo el HTML en local con file://),
        //    redibuja la imagen en un canvas y la guarda.
        // 3) Si el navegador también bloquea eso, la abre en una pestaña aparte.
        async function descargarImagenActual(){
            try{
                const respuesta = await fetch(currentImgUrl);
                if (!respuesta.ok) throw new Error('sin respuesta');
                guardarBlob(await respuesta.blob(), currentImgName);
                return;
            } catch (err){ /* seguimos con el plan B */ }

            if (!lightboxImg.complete || lightboxImg.naturalWidth === 0){
                alert('La imagen todavía está cargando, espera un segundo e inténtalo de nuevo.');
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = lightboxImg.naturalWidth;
            canvas.height = lightboxImg.naturalHeight;
            const extension = currentImgName.split('.').pop().toLowerCase();
            const tipo = extension === 'png' ? 'image/png'
                       : extension === 'webp' ? 'image/webp'
                       : 'image/jpeg';

            try{
                canvas.getContext('2d').drawImage(lightboxImg, 0, 0);
                canvas.toBlob((blob) => {
                    if (blob) guardarBlob(blob, currentImgName);
                    else abrirEnPestañaNueva();
                }, tipo, 0.95);
            } catch (err){
                abrirEnPestañaNueva();
            }
        }

        function abrirEnPestañaNueva(){
            const nueva = window.open(currentImgUrl, '_blank');
            if (!nueva){
                // Si el navegador bloqueó la ventana emergente, al menos intentamos
                // la descarga directa como último recurso.
                const a = document.createElement('a');
                a.href = currentImgUrl;
                a.download = currentImgName;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                a.remove();
            }
        }

        function closeLightbox(){
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.querySelectorAll('.gallery-item').forEach(recuadro => {
            recuadro.addEventListener('click', () => openLightbox(recuadro.querySelector('img')));
        });

        lightboxClose.addEventListener('click', closeLightbox);
        lightboxDownload.addEventListener('click', descargarImagenActual);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape'){
                closeLightbox();
                cerrarMenus();
            }
        });
    </script>

</body>
